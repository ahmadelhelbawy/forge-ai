name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The whole point of this pipeline is that it proves the deterministic core works
# with NO credentials. No secrets are made available to any job here, deliberately
# (NFR-007). The live-provider smoke is opt-in and never runs in CI.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (no key, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from package.json `packageManager`, so CI and a
      # contributor resolve the lockfile with the same pnpm.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # web/ imports the core through forge/dist/*, so this must precede the suite.
      - name: Build core
        run: pnpm --filter forge build

      - name: Typecheck (core and tests)
        run: pnpm typecheck

      - name: Typecheck (web)
        run: pnpm --dir web exec tsc --noEmit

      - name: Schema is generated, not hand-edited
        run: pnpm schema:check

      - name: Test suite
        run: pnpm test

      # The npm tarball, installed outside the repository, runs the CLI. Every
      # other test runs from the source tree, where profiles/ and strategies/
      # always exist; the tarball once shipped without strategies/.
      - name: Packed package works when installed
        run: ./scripts/pack-smoke.sh

      - name: No known vulnerabilities in production dependencies
        run: pnpm audit --prod --audit-level=moderate

  frozen-benchmark:
    name: frozen benchmark is untouched
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # evals/p16 is a pre-registered, hash-pinned experiment. A post-freeze edit
      # invalidates the recorded run, so the freeze is checked rather than trusted.
      - name: Verify evals/p16 manifest
        run: sha256sum -c evals/p16/MANIFEST.sha256

  secrets:
    name: no committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The whole history, with the synthetic test corpus allowlisted in
      # .gitleaks.toml. The pinned binary is verified against its checksum.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep "linux_x64.tar.gz" | sha256sum -c -
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --no-banner --redact --config .gitleaks.toml .

  product:
    name: product HTTP suite + browser acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # playwright-core never downloads a browser on its own; without this the
      # browser acceptance fails on a fresh runner ("Executable doesn't exist").
      - name: Install Chromium for the browser acceptance
        run: pnpm --dir web exec playwright-core install --with-deps chromium

      # Builds the core and the web app, starts stub-backed servers, runs the
      # HTTP suite (every test must run — none skipped) and the browser
      # acceptance. Still no credentials.
      - name: HTTP product suite + browser acceptance
        run: ./web/scripts/e2e.sh
