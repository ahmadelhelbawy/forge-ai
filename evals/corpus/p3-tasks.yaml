  text: >-
    The session cookie is sometimes dropped on Safari after the deploy
    preview Authenticates fine on Chrome. Done when Safari keeps the session
    across refresh.
  repository: fixtures/repos/small
  expected_goals:
    - "safari keeps the session"
  expected_constraints: []
  expected_questions:
    - "safari version"
    - "reproduction"
  expected_diagnostics: []
  forbidden:
    - "a specific root cause"
    - "any scope path"
    - "any verification command"

