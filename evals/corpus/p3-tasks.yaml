# P3 evaluation corpus extension (TS-R6) — tasks T13–T32.
#
# Together with the FROZEN thesis file tasks.yaml (T01–T12, do not amend),
# this brings the corpus to 32 tasks across the 8 categories of spec.md
# §17.4 (≥30 required). Each entry records: input text, repository fixture,
# expected goals/constraints as SET-CONTAINMENT phrases (never string
# equality), expected open questions, expected pipeline diagnostics, and
# forbidden outputs (content that must NOT be invented).
#
# expectation semantics (see tests/property/eval-corpus.test.ts):
# - every expected_* phrase must appear (case-insensitive substring) in some
#   node of that kind; extra nodes are fine
# - every forbidden phrase must appear in NO goal/constraint/verification
# - expected_diagnostics names codes the full pipeline should emit
- id: T13
