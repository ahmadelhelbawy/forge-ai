  text: >-
    Redesign the empty dashboard state in web/dashboard/EmptyState.tsx so new
    users understand what to do next. Keep the existing design tokens and do
    not add new dependencies. Done when three new users complete onboarding
    without asking for help.
  expected_goals:
    - "redesign the empty dashboard state"
    - "new users complete onboarding unaided"
  expected_constraints:
    - "existing design tokens kept"
    - "no new dependencies"
  expected_questions: []
  forbidden:
    - "a specific visual layout"
    - "copy text the user did not provide"

- id: T08
  category: research
  text: >-
    Evaluate whether to replace our hand-rolled rate limiter in
    src/middleware/rateLimit.ts with a token-bucket library. Compare at most
    three candidates on throughput, memory, and API fit. Deliver a written
    recommendation, not code.
  expected_goals:
    - "evaluate rate limiter replacement"
    - "written recommendation, no code"
  expected_constraints:
    - "at most three candidates"
    - "no code changes"
  expected_questions: []
  forbidden:
    - "a pre-selected winning library"
    - "implementing the replacement"

