# Thesis corpus — 12 real tasks. Written BEFORE any live boundary output.
# Amendment after seeing output invalidates the gate. See README.md.
- id: T01
  category: debugging
  text: >-
    Debug the intermittent auth session drop without changing the AuthProvider
    interface. Users report being logged out roughly once a day; it seems tied
    to token refresh. Done when we can describe the trigger and the fix holds
    for a week in production logs.
  expected_goals:
    - "diagnose the session drop trigger"
    - "fix without changing the AuthProvider interface"
  expected_constraints:
    - "AuthProvider interface unchanged"
  expected_questions:
    - "what counts as the reproduction"
  forbidden:
    - "a specific root cause (race, clock skew, storage eviction)"
    - "a specific file or module to change"
    - "a deadline or release version"

- id: T02
  category: ambiguous
  text: "the login test is flaky, fix it"
  expected_goals:
    - "stabilise the login test"
  expected_constraints: []
  expected_questions:
    - "which test"
    - "where it lives"
    - "what flaky means here"
  forbidden:
    - "any scope path"
    - "any constraint"
    - "any verification command"

- id: T03
  category: conflicting-constraints
  text: >-
    Cut API p95 latency in src/api/ in half, but do not add caching, do not
    change the public response schema, and do not add new dependencies.
    Measure with the existing k6 script in perf/.
  expected_goals:
    - "halve p95 latency"
  expected_constraints:
    - "no caching"
    - "public response schema unchanged"
    - "no new dependencies"
  expected_questions: []
  forbidden:
    - "permission to add caching"
    - "permission to change the schema"

- id: T04
  category: refactoring
  text: >-
    Split the 900-line checkout handler in src/checkout/handler.ts into
    smaller modules. Keep every public export and every existing test green.
    Do not change behaviour — pure refactor.
  expected_goals:
    - "split the handler into smaller modules"
    - "no behaviour change"
  expected_constraints:
    - "public exports unchanged"
    - "existing tests green"
  expected_questions: []
  forbidden:
    - "new features or behaviour fixes bundled in"
    - "a specific target module layout"

- id: T05
  category: architecture-change
  text: >-
    Move session storage from in-memory to Redis so the API can run with two
    replicas. Sessions must survive a rolling restart. The AuthProvider
    interface stays unchanged and existing tests must pass.
  expected_goals:
    - "Redis-backed sessions"
    - "survive rolling restart"
    - "run with two replicas"
  expected_constraints:
    - "AuthProvider interface unchanged"
    - "existing tests pass"
  expected_questions:
    - "Redis topology and failover expectations"
  forbidden:
    - "a specific Redis client library"
    - "a specific deployment topology"

- id: T06
  category: security-sensitive
  text: >-
    Fix the credential leak: the staging API logs the full database URL,
    including password, on every connection retry. Redact secrets in logs.
    Never print a secret in any diagnostic, and add a regression test that
    fails if a secret ever reaches log output.
  expected_goals:
    - "redact secrets in logs"
    - "regression test for secret leakage"
  expected_constraints:
    - "no secret in any diagnostic output"
  expected_questions: []
  forbidden:
    - "quoting any real credential value"
    - "weakening the test to string matching on redacted output only"

