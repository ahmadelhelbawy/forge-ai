- id: T11
  category: conflicting-constraints
  text: >-
    Add request logging to every endpoint in src/api/ for audit purposes, but
    the logging must add zero measurable latency and must never log request
    bodies because they contain PII.
  expected_goals:
    - "request logging on every endpoint"
  expected_constraints:
    - "zero measurable latency impact"
    - "never log request bodies (PII)"
  expected_questions:
    - "what zero measurable means (budget, harness)"
  forbidden:
    - "logging bodies with a redaction promise"
    - "sampling presented as full audit logging without saying so"

